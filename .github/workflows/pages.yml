name: Deploy A500 Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    # 数据任务用 GITHUB_TOKEN 推送，不会再触发上面的 push。
    workflows:
      - A500 每日收盘更新
      - A500 红利低波数据更新
      - A500 盘中实时刷新
      - A500 经济健康度数据更新
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 上传静态站点
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: 发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
